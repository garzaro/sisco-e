spring.config.import=optional:file:.env[.properties]

spring.threads.virtual.enabled=true

# CONFIGURAÇÕES DE SEGURANÇA (SPRING SECURITY & JWT)
# CORS - Origens permitidas (diferentes para Dev e Prod podem ser injetadas/configuradas)
#app.security.cors.allowed-origins=${ALLOWED_ORIGINS}

# JWT - Chave secreta (deve ser de 256-bit no mínimo para HMAC-SHA256)
# Em produção, utilize a variável de ambiente JWT_SECRET
app.security.jwt.secret=${JWT_SECRET}
# Expiração do token: 24 horas (em milissegundos)
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS}
