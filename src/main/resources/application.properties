#Força o Spring a carregar o arquivo .env se ele existir na raiz
spring.config.import=optional:file:.env[.properties]
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/sisco
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto = create
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

#Sobre o docker ao iniciar a aplicacao e desce ao parar - docker compose up/down
spring.docker.compose.enabled=false

#JWT
spring.app.jwtSecretKey=${SPRING_APP_JWT_SECRET_KEY}
spring.app.jwtExpirationMs=${SPRING_APP_JWT_EXPIRATION_MS}

#valor padrão de 86400000 (24 horas) para o ambiente de desenvolvimento local, caso a variável não esteja definida no sistema
#spring.app.jwtExpirationMs=${SPRING_APP_JWT_EXPIRATION_MS:86400000}

