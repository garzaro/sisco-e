#Força o Spring a carregar o arquivo .env se ele existir na raiz
spring.config.import=optional:file:.env[.properties]

#server.port=8081
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=${MIGRATION_CLASSPATH}
spring.flyway.default-schema=${MIGRATION_DEFAULT_SCHEMA}
spring.flyway.schemas=${MIGRATION_SCHEMA}
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true

#Sobre o docker ao iniciar a aplicacao e desce ao parar - docker compose up/down
spring.docker.compose.enabled=false

#JWT
app.security.jwt.jwtSecretKey=${JWT_SECRET}
app.security.jwt.jwtExpirationMs=${JWT_EXPIRATION_MS}
# Tempos de expiração
app.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}   

#REDIS
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.cache.type=${REDIS-CACHE}

#LOG
#grava logs em arquivo na raiz do projeto
logging.file.name=logs/app.log
#padrão de formatação de arquivo
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
#nível mínimo para o pacote da aplicação
logging.level.com.sisco_e=DEBUG


