# Configurações do Banco de Dados H2 em Memória para Testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS siscoescola
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do JPA/Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=false

# JWT local para subir contexto de teste sem depender de variáveis de ambiente
JWT_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
JWT_EXPIRATION_MS=86400000
spring.app.jwtSecretKey=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
spring.app.jwtExpirationMs=86400000
app.security.jwt.expiration=86400000
app.security.jwt.refresh-expiration=604800000

# Redis mock para testes (não conecta de fato)
spring.data.redis.host=localhost
spring.data.redis.port=6379
JWT_EXPIRATION=86400000
JWT_REFRESH_EXPIRATION=604800000