#server.port=${BACKEND_PORT}
# propriedade para carregar arquivo .env
spring.config.import=optional:file:.env[.properties]
#Conexao
server.port=8081
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS SISCOESCOLA;SCHEMA=SISCOESCOLA}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sa}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=SISCOESCOLA
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false
spring.messages.basename=messages

# CONFIGURAÇÕES DE SEGURANÇA (SPRING SECURITY & JWT)
app.security.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS}
